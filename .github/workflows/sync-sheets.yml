name: Sync Google Sheet data

# snapshot job: ดึงชีตเป็น <gid>.json แล้ว force-push ไป branch `data` (commit เดียวเสมอ ประวัติไม่โต)
#   หน้าเว็บอ่านจาก raw.githubusercontent.com/<repo>/data/ — ไม่ต้องพึ่ง Pages redeploy
#   (Pages redeploy ด้วย SHA เดิมซ้ำๆ ตอบ success แต่บางครั้งไม่อัปเดตไฟล์จริง)
# deploy job: deploy ตัวเว็บขึ้น Pages เฉพาะตอน push โค้ดเข้า main
# Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # ทุก 15 นาที (GitHub อาจดีเลย์ได้เมื่อคิวแน่น)
  workflow_dispatch:          # กดรันเองได้ที่แท็บ Actions

permissions:
  contents: write   # push snapshot ไป branch data
  actions: write    # ใช้กับขั้น keepalive ด้านล่าง
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch sheets
        run: python3 scripts/fetch_sheets.py _snap

      - name: Publish to data branch
        working-directory: _snap/data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          du -sh .

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude 'backup' \
                --exclude 'data' --exclude 'CLAUDE.md' --exclude '_site' --exclude '_snap' ./ _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub ปิด schedule ของรีโป public เองถ้าไม่มี commit 60 วัน
  # เรียก API "enable" ทุกรอบตามเวลาเพื่อรีเซ็ตตัวนับ (วิธีเดียวกับ keepalive-workflow)
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-sheets.yml/enable"
